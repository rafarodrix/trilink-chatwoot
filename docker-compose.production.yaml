version: '3'

services:
  base: &base
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        BUNDLE_WITHOUT: 'development:test'
        RAILS_ENV: 'production'
        RAILS_SERVE_STATIC_FILES: 'true'
    image: ${CHATWOOT_IMAGE_NAME:-rafarodrix/chatwoot:local}
    # No Dokploy, as variáveis da aba 'Environment' são injetadas automaticamente.
    # Manteremos o env_file apenas como fallback se você usar arquivos locais.
    env_file: .env 
    restart: always

  rails:
    <<: *base
    ports:
      - '${CHATWOOT_BIND_IP:-0.0.0.0}:${CHATWOOT_WEB_PORT:-3000}:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq:
    <<: *base
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

# O volume storage_data agora é opcional para mídias, mas o Chatwoot pode usar 
# para logs temporários ou cache de sistema. Recomendado manter.
volumes:
  storage_data: